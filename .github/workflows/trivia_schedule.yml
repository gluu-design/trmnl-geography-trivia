name: Generate Daily Geo Loop Data

on:
  schedule:
    # Every hour at :17. The script keeps tomorrow's question ready a day ahead,
    # so late or skipped GitHub runs don't change what's on screen.
    # The 6 AM question / 6 PM answer timing is handled by the TRMNL markup.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: geo-loop
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Trivia Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python trmnl_trivia.py

      - name: Commit Updated Data & History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          if git diff --staged --quiet; then
            echo "Nothing changed, no commit needed."
          else
            git commit -m "auto: update Geo Loop trivia feed"
            git pull --rebase
            git push
          fi
